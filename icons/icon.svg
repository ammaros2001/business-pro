<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f271c"/>
      <stop offset="50%" stop-color="#070a08"/>
      <stop offset="100%" stop-color="#040605"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff88"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="boxGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff88"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="boxGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="boxGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#10b981" stroke-width="6" stroke-opacity="0.35"/>

  <!-- Glowing Central Isometric Boxes / Business Hub Icon -->
  <g transform="translate(256, 256)" filter="url(#glow)">
    <!-- Top Face -->
    <path d="M 0 -130 L 115 -65 L 0 0 L -115 -65 Z" fill="url(#boxGrad1)"/>
    <!-- Left Face -->
    <path d="M -115 -65 L 0 0 L 0 130 L -115 65 Z" fill="url(#boxGrad2)"/>
    <!-- Right Face -->
    <path d="M 0 0 L 115 -65 L 115 65 L 0 130 Z" fill="url(#boxGrad3)"/>

    <!-- Subtle Lines / Accents -->
    <path d="M 0 -130 L 0 0" stroke="#00ff88" stroke-width="4" stroke-opacity="0.8"/>
    <path d="M -115 -65 L 0 0" stroke="#00ff88" stroke-width="4" stroke-opacity="0.8"/>
    <path d="M 115 -65 L 0 0" stroke="#00ff88" stroke-width="4" stroke-opacity="0.8"/>

    <!-- Small Rising Arrow (Growth & Profit Symbol) -->
    <path d="M -40 25 L 0 -15 L 40 25" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 0 -15 L 0 65" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- Accent Circle Ring -->
  <circle cx="256" cy="256" r="195" fill="none" stroke="#00ff88" stroke-width="2" stroke-dasharray="16 12" stroke-opacity="0.4"/>
</svg>
